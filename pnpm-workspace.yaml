# pnpm 11 起，设置都写在这个文件里（package.json 的 pnpm 字段已不再读取）。
#
# 仓是 workspace 布局：仓根是不发布的 private 包，插件放在 plugins/<短名>/。
# 实验材料 probes/ 不进 workspace：每个实验目录自带依赖、能单独运行。
# 文档站 docs-site/ 也不进：它自带 pnpm-workspace.yaml 与锁文件、在站目录里自己 install，收进来就是 workspace 里嵌套 workspace。

packages:
  # 插件：Windows 备份 windows-backup
  - plugins/*

allowBuilds:
  # @tailwindcss/node 间接依赖的包，它的安装脚本不需要运行
  '@parcel/watcher': false
  # 浏览器侧的打包器，安装脚本要下载二进制——不允许它运行，pnpm build 直接失败
  esbuild: true
